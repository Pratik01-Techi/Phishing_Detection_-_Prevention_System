<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #0a0e1a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .verdict {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .PHISHING { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #ef4444; }
    .SUSPICIOUS { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid #f59e0b; }
    .CLEAN { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid #10b981; }
    .UNKNOWN { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid #94a3b8; }
    .gauge-wrap { display: flex; justify-content: center; margin: 12px 0; }
    .gauge {
      width: 120px; height: 60px;
      border-radius: 60px 60px 0 0;
      background: conic-gradient(
        var(--color) calc(var(--score) * 1.8deg),
        #1f2937 calc(var(--score) * 1.8deg)
      );
      position: relative;
      overflow: hidden;
    }
    .gauge-inner {
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 90px; height: 45px;
      background: #0a0e1a;
      border-radius: 45px 45px 0 0;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 4px;
    }
    .score { font-size: 22px; font-weight: 700; font-family: monospace; }
    .meta { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
    .meta p { margin-bottom: 4px; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .btn-danger { background: #ef4444; color: white; }
    .btn-link { background: transparent; color: #3b82f6; border: 1px solid #3b82f6; }
    .loading { text-align: center; color: #94a3b8; font-size: 13px; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:20px">🛡️</span>
    <h1>PhishGuard</h1>
  </div>
  <div id="content">
    <p class="loading">Analyzing page...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
